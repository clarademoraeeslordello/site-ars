<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <!--
    ARS CALIBRE — Open Graph 1200×630
    Composição: fundo ink, logo centrada, tagline, decoração sutil
    Hierarquia: símbolo grande (240px) + wordmark grande + descriptor
  -->

  <!-- Fundo ink -->
  <rect width="1200" height="630" fill="#101014"/>

  <!-- Elemento decorativo: linhas hairline-dark criando grid suave -->
  <line x1="0" y1="315" x2="1200" y2="315" stroke="#3a3a40" stroke-width="0.5" opacity="0.4"/>
  <line x1="600" y1="0" x2="600" y2="630" stroke="#3a3a40" stroke-width="0.5" opacity="0.4"/>

  <!-- Círculos de referência decorativos (ultra-sutis, quase invisíveis) -->
  <circle cx="600" cy="315" r="280" stroke="#3a3a40" stroke-width="0.5" opacity="0.18" fill="none"/>
  <circle cx="600" cy="315" r="200" stroke="#3a3a40" stroke-width="0.5" opacity="0.12" fill="none"/>

  <!-- ── Símbolo grande: 240×240, centrado em (600, 240) ── -->
  <!-- Escalado ×7.5 (32→240), translate para centrar: (600-120, 240-180)=(480,60) -->
  <g transform="translate(480, 60) scale(7.5)">
    <!-- Arco base -->
    <path d="M4 24 A12 12 0 0 1 28 24" stroke="#3a3a40" stroke-width="0.9" fill="none"/>

    <!-- Tick 20% -->
    <line x1="6.6" y1="17.1" x2="5.3" y2="15.3" stroke="#3a3a40" stroke-width="0.5" opacity="0.5"/>

    <!-- Tick 40% -->
    <line x1="12.3" y1="12.6" x2="11.5" y2="11.0" stroke="#3a3a40" stroke-width="0.5" opacity="0.5"/>

    <!-- Tick 60% -->
    <line x1="19.7" y1="12.6" x2="20.4" y2="11.0" stroke="#6e6e73" stroke-width="0.7" opacity="0.7"/>

    <!-- Tick 80% -->
    <line x1="25.4" y1="17.1" x2="26.7" y2="15.3" stroke="#3a3a40" stroke-width="0.5" opacity="0.5"/>

    <!-- Tick 85% -->
    <line x1="26.7" y1="18.5" x2="28.2" y2="17.8" stroke="#c6a44a" stroke-width="0.9"/>

    <!-- Arco Audit Ready -->
    <path d="M26.7 18.5 A12 12 0 0 1 28 24" stroke="#c6a44a" stroke-width="1.4" fill="none" stroke-linecap="round"/>

    <!-- Ponteiro -->
    <line x1="16" y1="24" x2="25.6" y2="19.8" stroke="#c6a44a" stroke-width="0.75" stroke-linecap="round"/>

    <!-- Pivô -->
    <circle cx="16" cy="24" r="1.5" fill="#c6a44a"/>
    <circle cx="16" cy="24" r="0.6" fill="#101014"/>

    <!-- A -->
    <path d="M11 31 L16 24 L21 31" stroke="#faf8f4" stroke-width="1.1" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
    <line x1="13" y1="28" x2="19" y2="28" stroke="#faf8f4" stroke-width="0.9" stroke-linecap="round"/>
  </g>

  <!-- ── Wordmark ARS ── -->
  <text
    x="600"
    y="410"
    font-family="Fraunces, Georgia, serif"
    font-weight="600"
    font-size="96"
    letter-spacing="-2"
    fill="#faf8f4"
    text-anchor="middle"
  >ARS</text>

  <!-- ── Tagline ── -->
  <text
    x="600"
    y="455"
    font-family="IBM Plex Mono, ui-monospace, monospace"
    font-weight="400"
    font-size="18"
    letter-spacing="4"
    fill="#6e6e73"
    text-anchor="middle"
  >AUDIT READINESS SCORE</text>

  <!-- ── Descriptor ── -->
  <text
    x="600"
    y="530"
    font-family="IBM Plex Mono, ui-monospace, monospace"
    font-weight="400"
    font-size="14"
    letter-spacing="2.5"
    fill="#c6a44a"
    text-anchor="middle"
    opacity="0.7"
  >COMPLIANCE INTELLIGENCE PLATFORM</text>

  <!-- Linha decorativa separadora -->
  <line x1="480" y1="470" x2="720" y2="470" stroke="#3a3a40" stroke-width="1" opacity="0.6"/>
</svg>
