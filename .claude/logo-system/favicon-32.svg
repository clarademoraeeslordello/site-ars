<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!--
    ARS CALIBRE — Favicon 32px
    Variante: Fundo Escuro (ink #101014)
    Versão completa com todos os elementos visíveis a 32px
    (A simplificado — sem ticks menores)
  -->

  <!-- Fundo ink -->
  <rect width="32" height="32" rx="4" fill="#101014"/>

  <!-- Arco base -->
  <path d="M4 24 A12 12 0 0 1 28 24" stroke="#3a3a40" stroke-width="1" fill="none"/>

  <!-- Tick 60% -->
  <line x1="19.7" y1="12.6" x2="20.4" y2="11.0" stroke="#6e6e73" stroke-width="0.8" opacity="0.5"/>

  <!-- Tick 85% -->
  <line x1="26.7" y1="18.5" x2="28.2" y2="17.8" stroke="#c6a44a" stroke-width="1.2"/>

  <!-- Arco Audit Ready -->
  <path d="M26.7 18.5 A12 12 0 0 1 28 24" stroke="#c6a44a" stroke-width="1.8" fill="none" stroke-linecap="round"/>

  <!-- Ponteiro -->
  <line x1="16" y1="24" x2="25.6" y2="19.8" stroke="#c6a44a" stroke-width="1" stroke-linecap="round"/>

  <!-- Pivô -->
  <circle cx="16" cy="24" r="1.8" fill="#c6a44a"/>
  <circle cx="16" cy="24" r="0.7" fill="#101014"/>

  <!-- A simplificado (sem cruzeta para manter limpeza) -->
  <path d="M11 31 L16 24 L21 31" stroke="#faf8f4" stroke-width="1.4" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <line x1="13" y1="28" x2="19" y2="28" stroke="#faf8f4" stroke-width="1.1" stroke-linecap="round"/>
</svg>
