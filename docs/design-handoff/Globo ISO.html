<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Globo · certificados ISO/IEC 27001 por país</title>
<script src="https://unpkg.com/d3@7.9.0/dist/d3.min.js" integrity="sha384-CjloA8y00+1SDAUkjs099PVfnY2KmDC2BZnws9kh8D/lX1s46w6EPhpXdqMfjK6i" crossorigin="anonymous"></script>
<script src="https://unpkg.com/topojson-client@3.1.0/dist/topojson-client.min.js" integrity="sha384-Ukv1p/xTma6P4/2bY5KzWBw+ydSpXmhCMtyciIQVDJ1RmOxtCYNMF1uXT9T63H67" crossorigin="anonymous"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>html,body{margin:0;height:100%;background:#161618;overflow:hidden}svg{display:block;width:100%;height:100%;cursor:grab}svg:active{cursor:grabbing}
.lbl{font:500 11px 'IBM Plex Mono',monospace;fill:#faf8f4;paint-order:stroke;stroke:#161618;stroke-width:3px;letter-spacing:.04em}</style>
</head><body><svg id="g" role="img" aria-label="Globo com os países que mais têm certificados ISO/IEC 27001 em 2024"></svg>
<script>
const DATA={"156":["China",33359],"356":["Índia",6758],"392":["Japão",6644],"826":["Reino Unido",4445],"840":["EUA",4260],"380":["Itália",3284],"792":["Türkiye",3202],"276":["Alemanha",2444]};
const BR="076";
const svg=d3.select('#g'),reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const proj=d3.geoOrthographic().clipAngle(90).rotate([50,-12]);const path=d3.geoPath(proj);
const max=33359,col=d3.scaleSqrt().domain([0,max]).range(['#4a4232','#e2c477']);
fetch('https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json').then(r=>r.json()).then(topo=>{
  const countries=topojson.feature(topo,topo.objects.countries).features;
  const sphere=svg.append('path').datum({type:'Sphere'}).attr('fill','#1f1f22').attr('stroke','#3a3933');
  const grat=svg.append('path').datum(d3.geoGraticule10()).attr('fill','none').attr('stroke','#2a2925').attr('stroke-width',.6);
  const land=svg.append('g').selectAll('path').data(countries).join('path')
    .attr('fill',d=>DATA[d.id]?col(DATA[d.id][1]):d.id===BR?'#1f1f22':'#34332e')
    .attr('stroke',d=>d.id===BR?'#e2c477':'#161618').attr('stroke-width',d=>d.id===BR?1.4:.5);
  const pts=countries.filter(d=>DATA[d.id]||d.id===BR).map(d=>({id:d.id,c:d3.geoCentroid(d),n:DATA[d.id]?DATA[d.id][0]:'Brasil',v:DATA[d.id]?DATA[d.id][1]:0}));
  pts.find(p=>p.id==='840').c=[-98,39];
  const r=d3.scaleSqrt().domain([0,max]).range([3,22]);
  const dots=svg.append('g').selectAll('circle').data(pts).join('circle').attr('fill','rgba(226,196,119,.25)').attr('stroke','#e2c477').attr('stroke-width',1);
  const labels=svg.append('g').selectAll('text').data(pts).join('text').attr('class','lbl').text(d=>d.v?d.n+' '+d.v.toLocaleString('pt-BR'):'Brasil');
  function size(){const w=innerWidth,h=innerHeight,s=Math.min(w,h)/2-8;proj.scale(s).translate([w/2,h/2]);svg.attr('viewBox',`0 0 ${w} ${h}`);}
  function draw(){sphere.attr('d',path);grat.attr('d',path);land.attr('d',path);
    const ctr=proj.invert([innerWidth/2,innerHeight/2]);
    dots.each(function(d){const vis=d3.geoDistance(d.c,ctr)<1.45,[x,y]=proj(d.c);d3.select(this).attr('cx',x).attr('cy',y).attr('r',d.v?r(d.v):4).attr('opacity',vis?1:0);});
    labels.each(function(d){const vis=d3.geoDistance(d.c,ctr)<1.3,[x,y]=proj(d.c);d3.select(this).attr('x',x+(d.v?r(d.v):4)+5).attr('y',y+4).attr('opacity',vis?1:0);});}
  size();draw();addEventListener('resize',()=>{size();draw();});
  let paused=false,last=0;
  svg.call(d3.drag().on('start',()=>paused=true).on('drag',e=>{const k=75/proj.scale(),[a,b]=proj.rotate();proj.rotate([a+e.dx*k*1.5,Math.max(-60,Math.min(60,b-e.dy*k*1.5))]);draw();}).on('end',()=>{paused=false;}));
  if(!reduce)d3.timer(t=>{const dt=t-last;last=t;if(paused)return;const [a,b]=proj.rotate();proj.rotate([a+dt*.006,b]);draw();});
});
</script></body></html>
